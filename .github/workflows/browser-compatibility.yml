
name: Monthly browser compatibility

on:
  schedule:
    - cron: '30 21 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-compatibility
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update browser testing engine
        run: npm install --no-save --package-lock=false @playwright/test@latest

      - name: Install browsers
        run: npx playwright install --with-deps

      - name: Record browser test version
        run: npx playwright --version

      - name: Test production website
        run: npm run test:browser
        env:
          TEST_BASE_URL: https://npcinator.com
          CI: 'true'

      - name: Save test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-compatibility-report
          path: playwright-report/
          retention-days: 14
